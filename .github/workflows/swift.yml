name: Swift

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/swift.yml"
      - "tools/build-khuluma-app.sh"
      - "tools/make-signing-identity.sh"
      # Khuluma's TextPipeline must match the CLI cleanup byte for byte.
      - "bin/khuluma-lib.sh"
      - "bin/khuluma"
      - "bin/khuluma-lib/**"
      - "config/**"
      - "tests/fixtures/cleanup/**"
      - "tests/gen-cleanup-fixtures.sh"
      - "tests/gen_cleanup_fixtures.py"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/swift.yml"
      - "tools/build-khuluma-app.sh"
      - "tools/make-signing-identity.sh"
      # Khuluma's TextPipeline must match the CLI cleanup byte for byte.
      - "bin/khuluma-lib.sh"
      - "bin/khuluma"
      - "bin/khuluma-lib/**"
      - "config/**"
      - "tests/fixtures/cleanup/**"
      - "tests/gen-cleanup-fixtures.sh"
      - "tests/gen_cleanup_fixtures.py"

jobs:
  khuluma-native:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: native/.build
          key: swiftpm-khuluma-native-${{ runner.os }}-${{ hashFiles('native/Package.resolved') }}
          restore-keys: swiftpm-khuluma-native-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Cleanup fixtures match the CLI
        # Regenerates the expected outputs from the bash cleanup; fails if the
        # committed tests/fixtures/cleanup/expected.json is stale.
        run: ../tests/gen-cleanup-fixtures.sh --check

      - name: Test KhulumaDaemonKit and KhulumaCore
        run: swift test

      - name: Build release daemon
        run: swift build -c release --product khulumad && .build/release/khulumad version

      - name: Build Khuluma app binary
        run: swift build -c release --product Khuluma

      - name: Render UI snapshots
        # Fixed sample data only: no capture, CLI, daemon or user preferences.
        # Review material, so a runner without a window server doesn't fail CI.
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/khuluma-snapshots"
          .build/release/Khuluma -KhulumaStatsSnapshot "$RUNNER_TEMP/khuluma-snapshots"

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khuluma-ui-snapshots
          path: ${{ runner.temp }}/khuluma-snapshots
          if-no-files-found: warn
          retention-days: 14
