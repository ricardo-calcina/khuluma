name: Bug report
description: Report a reproducible issue in Khuluma
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what you expected.
    validations:
      required: true

  - type: dropdown
    id: flow
    attributes:
      label: Affected flow
      options:
        - dictation
        - transcribe (Finder or khuluma transcribe)
        - daemon
        - settings/vocabulary
        - build/install
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the relevant lines from ~/Library/Logs/Khuluma/app.log (they hold no dictated text), or `tools/khuluma-report.sh --days 2`.
      render: shell

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        macOS:
        Parakeet model:
        Khuluma version (the `launch:` line in app.log):
