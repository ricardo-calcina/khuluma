name: Feature request
description: Propose an enhancement aligned with roadmap direction
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe behavior, where it lives (Khuluma or the CLI), and tradeoffs.
    validations:
      required: true

  - type: dropdown
    id: roadmap
    attributes:
      label: Roadmap area
      options:
        - khuluma
        - cli (back end, file transcription)
        - daemon
        - rename roadmap phase
        - other

  - type: textarea
    id: risks
    attributes:
      label: Risks / compatibility
      description: Any behavior or migration risks?
